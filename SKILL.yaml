name: humanizador
version: 3.0.0
author: André Almeida
license: MIT
language: pt-BR
type: universal_prompt
description: >
  Prompt universal para humanizar textos em português brasileiro, removendo sinais comuns de escrita com cara de IA sem inventar fatos, alterar sentido ou apagar a voz do autor.
compatibility:
  model_providers:
    - OpenAI
    - Anthropic
    - Google Gemini
    - OpenRouter
    - xAI
    - any_llm_with_text_instructions
  agent_runtimes:
    - Manus
    - Claude Code
    - OpenCode
    - LangChain
    - CrewAI
    - AutoGen
    - n8n
    - custom_agents
requirements:
  external_tools: false
  internet_access: false
  function_calling: false
  persistent_memory: false
recommended_prompt_file: HUMANIZADOR.md
fallback_prompt_file: SKILL.md
usage: >
  Use HUMANIZADOR.md como system prompt, developer prompt, custom instruction, instrução permanente de agente ou primeira mensagem de contexto. Envie o texto a humanizar em uma mensagem separada, informando perfil, modo, formato e restrições quando necessário.
profiles:
  - linkedin
  - email-executivo
  - documentacao
  - proposta-comercial
  - academico
  - jornalistico
modes:
  - leve
  - padrao
  - forte
  - seguro-factual
output_formats:
  - completo
  - somente-versao
  - diagnostico
  - comparativo
core_rule: >
  Humanizar não é inventar. O modelo deve preservar sentido, respeitar o gênero textual, evitar fabricar fatos e sinalizar lacunas factuais quando o texto original não sustentar uma afirmação.
